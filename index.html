<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reply Assistant</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #2a2622;
    --muted: #746b60;
    --accent: #b5651d;
    --accent-soft: #f1e3d3;
    --border: #e7ddcf;
    --error-bg: #fbeaea;
    --error-text: #8a2b2b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --card: #262320;
      --text: #f1ece4;
      --muted: #b3a99c;
      --accent: #e0925a;
      --accent-soft: #3a2f24;
      --border: #3a352e;
      --error-bg: #3a2323;
      --error-text: #f0a5a5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: 0.95rem; }
  label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
  textarea, input[type=text] {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    resize: vertical;
  }
  textarea { min-height: 110px; margin-bottom: 16px; }
  input[type=text] { margin-bottom: 10px; }
  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.05); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  button.ghost:disabled { opacity: 0.5; cursor: not-allowed; }
  #results { margin-top: 24px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
  }
  .card p { margin: 0; line-height: 1.5; }
  .copy-btn {
    flex-shrink: 0;
    background: var(--accent-soft);
    color: var(--accent);
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .copy-btn.copied { background: var(--accent); color: #fff; }
  .toolbar { margin-top: 18px; display: flex; gap: 10px; }
  .error-box {
    margin-top: 16px;
    background: var(--error-bg);
    color: var(--error-text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.88rem;
    white-space: pre-wrap;
  }
  .loading { color: var(--muted); font-size: 0.9rem; margin-top: 16px; }
  footer { margin-top: 32px; color: var(--muted); font-size: 0.78rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Comment Reply Assistant</h1>
  <p class="subtitle">Paste a comment from the channel and get a few AI-written reply options that respond to what they actually said and end with a question — so the conversation keeps going.</p>

  <label for="commenterName">Commenter's name (optional)</label>
  <input type="text" id="commenterName" placeholder="e.g. Maria">

  <label for="comment">Their comment</label>
  <textarea id="comment" placeholder="Paste the YouTube comment here..."></textarea>

  <button class="primary" id="generateBtn">Generate replies</button>

  <div class="loading" id="loading" style="display:none;">Thinking…</div>
  <div class="error-box" id="errorBox" style="display:none;"></div>

  <div id="results"></div>

  <div class="toolbar" id="regenWrap" style="display:none;">
    <button class="ghost" id="regenBtn">Generate again</button>
  </div>

  <footer>For internal use replying to comments on Steve Rother's channel.</footer>
</div>

<script>
(function () {
  const API_KEY = 'AQ.Ab8RN6Ia10pcST-f542OUHWd7bEO3nXfhv61HS6almttcoiFvQ';
  const MODEL = 'gemini-3.6-flash';

  const commentEl = document.getElementById('comment');
  const nameEl = document.getElementById('commenterName');
  const generateBtn = document.getElementById('generateBtn');
  const regenBtn = document.getElementById('regenBtn');
  const regenWrap = document.getElementById('regenWrap');
  const resultsEl = document.getElementById('results');
  const loadingEl = document.getElementById('loading');
  const errorBox = document.getElementById('errorBox');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }
  function clearError() {
    errorBox.style.display = 'none';
    errorBox.textContent = '';
  }

  const CHANNEL_CONTEXT = `Background on this channel (steverother.org), for context only — don't force any of this into every reply, only draw on it when it's naturally relevant to what the commenter said:
- Steve Rother channels "The Group," a collective of non-physical guides; the channel shares their messages on soul evolution, higher consciousness, and navigating change.
- Recurring themes: soul contracts made before this life, inner-child healing, energetic/generational trauma and imprints, multidimensional awareness, living authentically, and stepping into personal power.
- Recurring programs/language: the "Mystic Zone," the monthly "Beacons of Light" messages, "Espavo" (a term of gratitude/honoring used in the community), and referring to returning to one's true self as coming "Home."
- Audience tends to be people on a spiritual/personal-growth path, often processing something emotionally significant in their comments.`;

  async function callGemini(comment, name) {
    const system = `You are helping a co-owner of a YouTube channel reply to a viewer's comment.

${CHANNEL_CONTEXT}

Write reply options that:
- Specifically acknowledge something the commenter actually said — reference their words or point, don't be generic
- Sound warm, natural, and conversational, like a real person typing a quick reply — not corporate, not AI-sounding
- Where genuinely relevant, reflect the channel's world and language above — but never invent claims about a specific video's content, and never force in jargon that doesn't fit what the commenter actually said
- End with an open-ended question that invites the commenter to keep the conversation going
- Are short: 1-3 sentences
- Are meaningfully different from each other in angle, tone, and opening — not just reworded copies

Respond with ONLY a valid JSON array of exactly 5 strings (the reply options). No markdown, no code fences, no extra commentary, no explanation — just the JSON array.`;

    const userContent = `Commenter name: ${name || '(not given)'}\nComment: """${comment}"""`;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(MODEL)}:generateContent?key=${encodeURIComponent(API_KEY)}`;

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents: [{ role: 'user', parts: [{ text: userContent }] }],
        generationConfig: { temperature: 0.9 }
      })
    });

    if (!res.ok) {
      let detail = '';
      try {
        const errJson = await res.json();
        detail = errJson.error && errJson.error.message ? errJson.error.message : JSON.stringify(errJson);
      } catch (e) {
        detail = await res.text().catch(() => '');
      }
      throw new Error(`API error ${res.status}: ${detail}`);
    }

    const data = await res.json();
    const parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
    const text = parts && parts.map(p => p.text || '').join('');
    if (!text) throw new Error('No content returned from the API.');

    let replies;
    try {
      replies = JSON.parse(text);
    } catch (e) {
      const match = text.match(/\[[\s\S]*\]/);
      if (match) {
        replies = JSON.parse(match[0]);
      } else {
        throw new Error('Could not parse the AI response as JSON:\n' + text);
      }
    }
    if (!Array.isArray(replies) || !replies.length) {
      throw new Error('Unexpected response format from the AI.');
    }
    return replies;
  }

  function renderResults(replies) {
    resultsEl.innerHTML = '';
    replies.forEach((text) => {
      const card = document.createElement('div');
      card.className = 'card';

      const p = document.createElement('p');
      p.textContent = text;

      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', () => copyText(text, btn));

      card.appendChild(p);
      card.appendChild(btn);
      resultsEl.appendChild(card);
    });
    regenWrap.style.display = replies.length ? 'flex' : 'none';
  }

  function copyText(text, btn) {
    const done = () => {
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* no-op */ }
    document.body.removeChild(ta);
    done();
  }

  async function generate() {
    const comment = commentEl.value.trim();
    if (!comment) {
      commentEl.focus();
      return;
    }
    const name = nameEl.value.trim();

    clearError();
    resultsEl.innerHTML = '';
    regenWrap.style.display = 'none';
    generateBtn.disabled = true;
    regenBtn.disabled = true;
    loadingEl.style.display = 'block';

    try {
      const replies = await callGemini(comment, name);
      renderResults(replies);
    } catch (err) {
      showError(err.message || String(err));
    } finally {
      loadingEl.style.display = 'none';
      generateBtn.disabled = false;
      regenBtn.disabled = false;
    }
  }

  generateBtn.addEventListener('click', generate);
  regenBtn.addEventListener('click', generate);
  commentEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) generate();
  });
})();
</script>
</body>
</html>
